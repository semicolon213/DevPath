openapi: 3.0.3
info:
  title: DevPath Implemented API
  version: 0.21.0
  description: >
    Implemented contract for authenticated identity, repository synchronization, deterministic analysis,
    rule evaluation, Skill Matrix, career catalog, career readiness, deterministic recommendation,
    learning roadmap, company catalog, onboarding-progress, dashboard-summary, GitHub connection-recovery,
    provider rate-limit recovery, and repository collaboration/document evidence slices. Provider access tokens,
    private README content, and unimplemented APIs are excluded.
servers:
  - url: http://localhost:8080
    description: Local backend
paths:
  /internal/health:
    get:
      summary: Backend health check
      operationId: getInternalHealth
      tags: [Internal]
      security: []
      responses:
        "200":
          description: Non-sensitive backend health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /oauth2/authorization/github:
    get:
      summary: Start GitHub OAuth login
      description: Spring Security owns this authorization entry point and redirects to GitHub.
      operationId: initiateGitHubLogin
      tags: [Authentication]
      security: []
      responses:
        "302":
          description: Redirect to the configured GitHub authorization endpoint.
  /login/oauth2/code/github:
    get:
      summary: Complete GitHub OAuth login
      description: >
        Spring Security owns this callback. A successful callback provisions or resolves the internal
        user, rotates the session identifier, stores the security context in the server-side JDBC
        session, and redirects to the configured frontend origin.
      operationId: completeGitHubLogin
      tags: [Authentication]
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the configured frontend success or failure location.
  /api/v1/csrf:
    get:
      summary: Issue a CSRF token
      operationId: getCsrfToken
      tags: [Authentication]
      security: []
      responses:
        "200":
          description: CSRF token for a subsequent state-changing browser request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenEnvelope"
  /api/v1/users/me:
    get:
      x-api-id: API-ID-001
      summary: Retrieve the current authenticated user
      operationId: getCurrentUser
      tags: [Identity]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current internal DevPath user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserEnvelope"
        "401":
          description: No valid DevPath session or unavailable account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/users/me/profile:
    get:
      x-api-id: API-ID-002
      summary: Retrieve the current user's profile
      operationId: getUserProfile
      tags: [Identity]
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Current user's profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserProfileEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    patch:
      x-api-id: API-ID-003
      summary: Update the current user's profile
      operationId: updateUserProfile
      tags: [Identity]
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateUserProfileRequest"}
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserProfileEnvelope"}
        "400":
          description: Invalid profile input.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/users/me/connections:
    get:
      x-api-id: API-ID-004
      summary: List the current user's provider connections
      description: Login identity alone does not imply repository-access authorization. Inactive connection history is returned with empty scopes so the client can offer recovery without attempting provider access.
      operationId: listUserConnections
      tags: [Identity, Integration]
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Active or recoverable inactive provider connections owned by the current user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectedAccountListEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/users/me/preferences:
    get:
      x-api-id: API-ID-005
      summary: Retrieve current target preferences
      operationId: getUserPreferences
      tags: [Identity]
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Current career and company targets.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPreferenceEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/users/me/preferences/career:
    put:
      x-api-id: API-ID-006
      summary: Set the current user's career target
      operationId: setCareerTarget
      tags: [Identity]
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetCareerTargetRequest"}
      responses:
        "200":
          description: Updated target preferences.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPreferenceEnvelope"}
        "400":
          description: Unsupported career target.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/users/me/preferences/company:
    put:
      x-api-id: API-ID-007
      summary: Set the current user's company target
      operationId: setCompanyTarget
      tags: [Identity]
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetCompanyTargetRequest"}
      responses:
        "200":
          description: Updated target preferences.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPreferenceEnvelope"}
        "400":
          description: Unsupported company target.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/integrations/github:
    delete:
      x-api-id: API-INT-003
      summary: Disconnect GitHub repository access
      operationId: disconnectGitHubIntegration
      tags: [Integration]
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: GitHub access was removed locally and remote token revocation was attempted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectedAccountEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: No active GitHub connection exists for the current user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: Local credential removal could not be completed safely.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/integrations/github/authorize:
    post:
      x-api-id: API-INT-001
      summary: Start GitHub App user authorization
      operationId: initiateGitHubIntegration
      tags: [Integration]
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InitiateOAuthRequest"}
      responses:
        "200":
          description: Short-lived, session-bound authorization URL.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthAuthorizationEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: GitHub integration configuration is unavailable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/integrations/github/callback:
    get:
      x-api-id: API-INT-002
      summary: Complete GitHub App user authorization
      operationId: completeGitHubIntegration
      tags: [Integration]
      security: [{sessionCookie: []}]
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        "302":
          description: Redirect to the configured frontend with a safe connection result.
        "401":
          description: The account-linking session is unavailable.
  /api/v1/integrations/github/repositories:
    get:
      x-api-id: API-INT-004
      summary: List repositories accessible through installed GitHub Apps
      operationId: listGitHubRepositories
      tags: [Integration]
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Provider-normalized repositories accessible to the current user and app installation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubRepositoryListEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "429":
          description: GitHub request quota is exhausted; the connection remains active and retry timing is exposed safely.
          headers:
            Retry-After: {schema: {type: string}, description: Provider-safe delay seconds or HTTP reset date when known.}
            X-RateLimit-Reset: {schema: {type: string}, description: Provider reset time as Unix epoch seconds when known.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: GitHub is unavailable or reconnection is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repositories/imports:
    post:
      x-api-id: API-INT-005
      summary: Import an accessible GitHub repository into DevPath
      operationId: importGitHubRepository
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ImportRepositoryRequest"}
      responses:
        "201":
          description: Canonical imported repository metadata. Duplicate imports return the existing owner-scoped resource.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositoryEnvelope"}
        "400":
          description: Invalid or inaccessible provider repository reference.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "409":
          description: A concurrent repository registration changed the resource state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "429":
          description: GitHub request quota is exhausted; retry after the returned provider-safe timing.
          headers:
            Retry-After: {schema: {type: string}, description: Provider-safe delay seconds or HTTP reset date when known.}
            X-RateLimit-Reset: {schema: {type: string}, description: Provider reset time as Unix epoch seconds when known.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: GitHub repository verification is unavailable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repositories:
    get:
      x-api-id: API-REP-001
      summary: List imported repositories owned by the current user
      operationId: listRepositories
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
        - {name: includeArchived, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Bounded owner-scoped repository page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositoryListEnvelope"}
        "400":
          description: Invalid limit or cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repositories/{repositoryId}:
    get:
      x-api-id: API-REP-002
      summary: Retrieve an imported repository owned by the current user
      operationId: getRepository
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - {name: repositoryId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Owner-scoped repository metadata and current synchronization state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositoryEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Repository not found for the current owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repositories/{repositoryId}/archive:
    post:
      x-api-id: API-REP-004
      summary: Archive an imported repository locally
      operationId: archiveRepository
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - {name: repositoryId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Canonical repository metadata in the archived lifecycle state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositoryEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Repository not found for the current owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "409":
          description: A concurrent repository lifecycle change caused a conflict.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repositories/{repositoryId}/restore:
    post:
      x-api-id: API-REP-005
      summary: Restore a locally archived repository
      operationId: restoreRepository
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - {name: repositoryId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Canonical repository metadata in its restored lifecycle state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositoryEnvelope"}
        "400":
          description: Provider-archived repository cannot be restored locally.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Repository not found for the current owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "409":
          description: A concurrent repository lifecycle change caused a conflict.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repositories/{repositoryId}/sync:
    post:
      x-api-id: API-REP-006
      summary: Queue a durable full repository synchronization
      operationId: synchronizeRepository
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - {name: repositoryId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "202":
          description: Existing or newly queued owner-scoped synchronization job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositorySyncJobEnvelope"}
        "400":
          description: Invalid idempotency key or repository lifecycle.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Repository not found for the current owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: GitHub permission re-verification is unavailable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repository-sync-jobs/{jobId}:
    get:
      x-api-id: API-INT-007
      summary: Retrieve an owner-scoped repository synchronization job
      operationId: getRepositorySyncJob
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Current durable job state and safe failure detail.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositorySyncJobEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Job not found for the current owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repositories/{repositoryId}/snapshots:
    get:
      x-api-id: API-REP-007
      summary: List immutable snapshots for an owned repository
      operationId: listRepositorySnapshots
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - {name: repositoryId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Newest-first immutable snapshot metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositorySnapshotListEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Repository not found for the current owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repositories/{repositoryId}/snapshots/{snapshotId}:
    get:
      x-api-id: API-REP-008
      summary: Retrieve immutable snapshot metadata for an owned repository
      operationId: getRepositorySnapshot
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - {name: repositoryId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: snapshotId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Immutable snapshot metadata and deterministic content hash.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositorySnapshotEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Snapshot not found within the owned repository.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repositories/{repositoryId}/technologies:
    get:
      x-api-id: API-REP-009
      summary: Retrieve normalized technologies from the current owned snapshot
      operationId: getRepositoryTechnologies
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - {name: repositoryId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Deterministic language, framework, and database evidence; no official score is calculated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TechnologySummaryEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Repository or synchronized snapshot not found for the current owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/repositories/{repositoryId}/evidence:
    get:
      x-api-id: API-REP-011
      summary: Retrieve deterministic engineering evidence from the current owned snapshot
      operationId: getRepositoryEvidence
      tags: [Repository]
      security: [{sessionCookie: []}]
      parameters:
        - {name: repositoryId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Measurable evidence signals without official scores.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositoryEvidenceSummaryEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Repository or synchronized snapshot not found for the current owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/analyses:
    get:
      x-api-id: API-ANA-007
      summary: List completed deterministic analyses owned by the current user
      operationId: listAnalysisHistory
      tags: [Analysis]
      security: [{sessionCookie: []}]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Newest-first owner-scoped immutable analysis history.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnalysisHistoryEnvelope"}
        "400":
          description: Invalid limit or cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    post:
      x-api-id: API-ANA-001
      summary: Queue deterministic analysis for an owned repository snapshot
      operationId: requestAnalysis
      tags: [Analysis]
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAnalysisRequest"}
      responses:
        "202":
          description: Existing or newly queued owner-scoped analysis job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnalysisJobEnvelope"}
        "400":
          description: Invalid scope, unsupported target, or repository without a ready snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: No valid session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Repository or snapshot not found for the current owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "409":
          description: Concurrent analysis request conflict.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/analysis-jobs/{jobId}:
    get:
      x-api-id: API-ANA-002
      summary: Retrieve an owner-scoped deterministic analysis job
      operationId: getAnalysisJob
      tags: [Analysis]
      security: [{sessionCookie: []}]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
