      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, metadata]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
        metadata:
          $ref: "#/components/schemas/ApiMetadata"
