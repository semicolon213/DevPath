components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: DEVPATH_SESSION
      description: Opaque HttpOnly server-session identifier. It is never read by browser JavaScript.
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Server-issued CSRF token. This is not an authentication credential.
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Owner-scoped stable key for one repository synchronization command.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
  schemas:
    ApiMetadata:
      type: object
      additionalProperties: false
      required: [requestId, apiVersion, timestamp]
      properties:
        requestId:
          type: string
        apiVersion:
          type: string
          example: v1
        timestamp:
          type: string
          format: date-time
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, application, timestamp]
      properties:
        status:
          type: string
          example: ok
        application:
          type: string
          example: devpath-backend
        timestamp:
          type: string
          format: date-time
    CurrentUser:
      type: object
      additionalProperties: false
      required: [userId, displayName, status, authenticationProvider, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 120
        avatarUrl:
          type: string
          format: uri
          nullable: true
        status:
          type: string
          enum: [ACTIVE]
        authenticationProvider:
          type: string
          enum: [GITHUB]
        createdAt:
          type: string
          format: date-time
    CurrentUserEnvelope:
      type: object
      additionalProperties: false
      required: [data, metadata]
      properties:
        data:
          $ref: "#/components/schemas/CurrentUser"
        metadata:
          $ref: "#/components/schemas/ApiMetadata"
    CareerStage:
      type: string
      nullable: true
      enum: [STUDENT, ENTRY_LEVEL, JUNIOR, MID_LEVEL, SENIOR]
    UserProfile:
      type: object
      additionalProperties: false
      required: [profileId, displayName, careerStage, bio, updatedAt]
      properties:
        profileId: {type: string, format: uuid}
        displayName: {type: string, minLength: 1, maxLength: 120}
        careerStage: {$ref: "#/components/schemas/CareerStage"}
        bio: {type: string, maxLength: 1000, nullable: true}
        updatedAt: {type: string, format: date-time}
    UpdateUserProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName, careerStage, bio]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120}
        careerStage: {$ref: "#/components/schemas/CareerStage"}
        bio: {type: string, maxLength: 1000, nullable: true}
    UserProfileEnvelope:
      type: object
      additionalProperties: false
      required: [data, metadata]
      properties:
        data: {$ref: "#/components/schemas/UserProfile"}
        metadata: {$ref: "#/components/schemas/ApiMetadata"}
    UserPreference:
      type: object
      additionalProperties: false
      required: [careerId, companyId, updatedAt]
      properties:
        careerId: {type: string, maxLength: 64, nullable: true}
        companyId: {type: string, maxLength: 64, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
    SetCareerTargetRequest:
      type: object
      additionalProperties: false
      required: [careerId]
      properties:
        careerId: {type: string, minLength: 1, maxLength: 64}
    SetCompanyTargetRequest:
      type: object
      additionalProperties: false
      required: [companyId]
      properties:
        companyId: {type: string, minLength: 1, maxLength: 64}
    UserPreferenceEnvelope:
      type: object
      additionalProperties: false
      required: [data, metadata]
      properties:
        data: {$ref: "#/components/schemas/UserPreference"}
        metadata: {$ref: "#/components/schemas/ApiMetadata"}
    ConnectedAccount:
      type: object
      additionalProperties: false
      required: [connectionId, provider, status, scopes, connectedAt, expiresAt]
      properties:
        connectionId: {type: string, format: uuid}
        provider: {type: string, enum: [GITHUB]}
        status: {type: string, enum: [ACTIVE, REVOKED]}
        scopes:
          type: array
          items: {type: string}
        connectedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, nullable: true}
    ConnectedAccountList:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items: {$ref: "#/components/schemas/ConnectedAccount"}
    ConnectedAccountEnvelope:
      type: object
      additionalProperties: false
      required: [data, metadata]
      properties:
        data: {$ref: "#/components/schemas/ConnectedAccount"}
        metadata: {$ref: "#/components/schemas/ApiMetadata"}
    ConnectedAccountListEnvelope:
      type: object
      additionalProperties: false
      required: [data, metadata]
      properties:
        data: {$ref: "#/components/schemas/ConnectedAccountList"}
        metadata: {$ref: "#/components/schemas/ApiMetadata"}
    InitiateOAuthRequest:
      type: object
      additionalProperties: false
    OAuthAuthorization:
      type: object
      additionalProperties: false
      required: [authorizationUrl]
      properties:
        authorizationUrl: {type: string, format: uri}
    OAuthAuthorizationEnvelope:
      type: object
      additionalProperties: false
      required: [data, metadata]
      properties:
        data: {$ref: "#/components/schemas/OAuthAuthorization"}
        metadata: {$ref: "#/components/schemas/ApiMetadata"}
    GitHubRepository:
      type: object
      additionalProperties: false
      required: [providerRepositoryId, name, fullName, owner, privateRepository, archived, defaultBranch, htmlUrl]
      properties:
        providerRepositoryId: {type: string}
        name: {type: string}
        fullName: {type: string}
        owner: {type: string}
        privateRepository: {type: boolean}
        archived: {type: boolean}
        defaultBranch: {type: string}
        htmlUrl: {type: string, format: uri}
    GitHubRepositoryList:
      type: object
      additionalProperties: false
      required: [repositories]
      properties:
        repositories:
          type: array
          items: {$ref: "#/components/schemas/GitHubRepository"}
    GitHubRepositoryListEnvelope:
      type: object
      additionalProperties: false
      required: [data, metadata]
      properties:
        data: {$ref: "#/components/schemas/GitHubRepositoryList"}
        metadata: {$ref: "#/components/schemas/ApiMetadata"}
    ImportRepositoryRequest:
      type: object
      additionalProperties: false
      required: [providerRepositoryId]
      properties:
        providerRepositoryId: {type: string, pattern: "^[1-9][0-9]{0,63}$"}
    Repository:
      type: object
      additionalProperties: false
      required: [repositoryId, providerRepositoryId, name, fullName, owner, visibility, defaultBranch, providerArchived, lifecycle, syncStatus, htmlUrl, discoveredAt, lastSyncedAt, currentSnapshotId]
      properties:
        repositoryId: {type: string, format: uuid}
        providerRepositoryId: {type: string}
        name: {type: string, maxLength: 100}
        fullName: {type: string, maxLength: 255}
        owner: {type: string, maxLength: 255}
        visibility: {type: string, enum: [PUBLIC, PRIVATE]}
        defaultBranch: {type: string, maxLength: 255}
        providerArchived: {type: boolean}
        lifecycle: {type: string, enum: [DISCOVERED, ACTIVE, ARCHIVED, DELETED_EXTERNALLY]}
        syncStatus: {type: string, enum: [NOT_SYNCED, SYNCHRONIZED, FAILED]}
        htmlUrl: {type: string, format: uri}
        discoveredAt: {type: string, format: date-time}
        lastSyncedAt: {type: string, format: date-time, nullable: true}
        currentSnapshotId: {type: string, format: uuid, nullable: true}
    RepositoryEnvelope:
      type: object
      additionalProperties: false
      required: [data, metadata]
      properties:
        data: {$ref: "#/components/schemas/Repository"}
        metadata: {$ref: "#/components/schemas/ApiMetadata"}
    RepositoryList:
      type: object
      additionalProperties: false
      required: [repositories, limit, nextCursor, totalCount]
      properties:
        repositories:
          type: array
          items: {$ref: "#/components/schemas/Repository"}
        limit: {type: integer, minimum: 1, maximum: 100}
        nextCursor: {type: string, nullable: true}
        totalCount: {type: integer, format: int64, minimum: 0}
    RepositoryListEnvelope:
      type: object
      additionalProperties: false
      required: [data, metadata]
      properties:
        data: {$ref: "#/components/schemas/RepositoryList"}
        metadata: {$ref: "#/components/schemas/ApiMetadata"}
    RepositorySyncJob:
      type: object
      additionalProperties: false
      required: [jobId, jobType, status, phase, progressPercent, attemptCount, maxAttempts, submittedAt, startedAt, completedAt, pollingUrl, resultResourceUrl, errorCode, errorMessage, retryable]
      properties:
        jobId: {type: string, format: uuid}
        jobType: {type: string, enum: [REPOSITORY_SYNC]}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled, expired]}
        phase: {type: string, enum: [QUEUED, COLLECTING, RETRY_WAIT, COMPLETED, FAILED]}
        progressPercent: {type: integer, minimum: 0, maximum: 100}
        attemptCount: {type: integer, minimum: 0}
        maxAttempts: {type: integer, minimum: 1}
        submittedAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        pollingUrl: {type: string}
        resultResourceUrl: {type: string, nullable: true}
        errorCode: {type: string, nullable: true}
        errorMessage: {type: string, nullable: true}
        retryable: {type: boolean}
    RepositorySyncJobEnvelope:
      type: object
      additionalProperties: false
      required: [data, metadata]
      properties:
        data: {$ref: "#/components/schemas/RepositorySyncJob"}
        metadata: {$ref: "#/components/schemas/ApiMetadata"}
    CreateAnalysisRequest:
      type: object
      additionalProperties: false
      required: [repositoryId]
      properties:
        repositoryId: {type: string, format: uuid}
        snapshotId: {type: string, format: uuid, nullable: true}
        analysisScope: {type: string, enum: [REPOSITORY_BASELINE], default: REPOSITORY_BASELINE}
        targetCareerId:
          type: string
          nullable: true
          description: Reserved contract field; non-null values are rejected until career policies are implemented.
    AnalysisJob:
      type: object
      additionalProperties: false
      required: [jobId, jobType, status, phase, progressPercent, attemptCount, maxAttempts, submittedAt, startedAt, completedAt, pollingUrl, resultResourceUrl, errorCode, errorMessage, retryable]
      properties:
        jobId: {type: string, format: uuid}
        jobType: {type: string, enum: [REPOSITORY_ANALYSIS]}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled, expired]}
        phase: {type: string, enum: [QUEUED, EVALUATING_RULES, RETRY_WAIT, COMPLETED, FAILED]}
        progressPercent: {type: integer, minimum: 0, maximum: 100}
        attemptCount: {type: integer, minimum: 0}
        maxAttempts: {type: integer, minimum: 1}
        submittedAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        pollingUrl: {type: string}
