spring:
  application:
    name: devpath-backend
  datasource:
    url: ${DEVPATH_DB_URL}
    username: ${DEVPATH_DB_USERNAME}
    password: ${DEVPATH_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
        provider:
          github:
            user-name-attribute: id
  session:
    store-type: jdbc
    timeout: ${DEVPATH_SESSION_IDLE_TIMEOUT:30m}
    jdbc:
      initialize-schema: never

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: ${DEVPATH_SESSION_COOKIE_NAME:DEVPATH_SESSION}
        http-only: true
        secure: ${DEVPATH_SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [request_id=%X{request_id:-none} correlation_id=%X{correlation_id:-none}] %logger{36} - %msg%n"

devpath:
  runtime:
    worker-enabled: ${DEVPATH_WORKER_ENABLED:true}
  jobs:
    shutdown-timeout: ${DEVPATH_WORKER_SHUTDOWN_TIMEOUT:10m}
    repository-sync:
      poll-interval: ${DEVPATH_REPOSITORY_SYNC_POLL_INTERVAL:1000}
      initial-delay: ${DEVPATH_REPOSITORY_SYNC_INITIAL_DELAY:1000}
    analysis:
      poll-interval: ${DEVPATH_ANALYSIS_POLL_INTERVAL:1000}
      initial-delay: ${DEVPATH_ANALYSIS_INITIAL_DELAY:1500}
    knowledge-ingestion:
      poll-interval: ${DEVPATH_KNOWLEDGE_POLL_INTERVAL:1000}
      initial-delay: ${DEVPATH_KNOWLEDGE_INITIAL_DELAY:2000}
    ai-generation:
      poll-interval: ${DEVPATH_AI_POLL_INTERVAL:1000}
      initial-delay: ${DEVPATH_AI_INITIAL_DELAY:2500}
  security:
    frontend-origin: ${DEVPATH_FRONTEND_ORIGIN}
    session-absolute-timeout: ${DEVPATH_SESSION_ABSOLUTE_TIMEOUT:12h}
    post-login-redirect: ${DEVPATH_POST_LOGIN_REDIRECT:/}
  targets:
    version: v1
  github:
    integration:
      connect-timeout: ${DEVPATH_GITHUB_CONNECT_TIMEOUT:5s}
      read-timeout: ${DEVPATH_GITHUB_READ_TIMEOUT:30s}
      client-id: ${GITHUB_INTEGRATION_CLIENT_ID:}
      client-secret: ${GITHUB_INTEGRATION_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_INTEGRATION_REDIRECT_URI:http://localhost:8080/api/v1/integrations/github/callback}
      credential-key: ${DEVPATH_PROVIDER_CREDENTIAL_KEY:}
      credential-key-version: ${DEVPATH_PROVIDER_CREDENTIAL_KEY_VERSION:local-v1}
  notion:
    integration:
      connect-timeout: ${DEVPATH_NOTION_CONNECT_TIMEOUT:5s}
      read-timeout: ${DEVPATH_NOTION_READ_TIMEOUT:30s}
      client-id: ${NOTION_INTEGRATION_CLIENT_ID:}
      client-secret: ${NOTION_INTEGRATION_CLIENT_SECRET:}
      redirect-uri: ${NOTION_INTEGRATION_REDIRECT_URI:http://localhost:8080/api/v1/integrations/notion/callback}
      credential-key: ${DEVPATH_PROVIDER_CREDENTIAL_KEY:}
      credential-key-version: ${DEVPATH_PROVIDER_CREDENTIAL_KEY_VERSION:local-v1}
  knowledge:
    object-storage-root: ${DEVPATH_OBJECT_STORAGE_ROOT:./.devpath/objects}
    retrieval:
      minimum-relevance: ${DEVPATH_RETRIEVAL_MINIMUM_RELEVANCE:0.25}
    embedding:
      base-url: ${DEVPATH_EMBEDDING_BASE_URL:http://localhost:11434}
      model: ${DEVPATH_EMBEDDING_MODEL:nomic-embed-text}
      model-version: ${DEVPATH_EMBEDDING_MODEL_VERSION:nomic-embed-text}
      dimension: ${DEVPATH_EMBEDDING_DIMENSION:768}
      connect-timeout: ${DEVPATH_EMBEDDING_CONNECT_TIMEOUT:5s}
      read-timeout: ${DEVPATH_EMBEDDING_READ_TIMEOUT:60s}
  ai:
    generation:
      base-url: ${DEVPATH_AI_BASE_URL:http://localhost:11434}
      model: ${DEVPATH_AI_MODEL:qwen2.5:7b}
      connect-timeout: ${DEVPATH_AI_CONNECT_TIMEOUT:5s}
      read-timeout: ${DEVPATH_AI_READ_TIMEOUT:90s}
      max-attempts: ${DEVPATH_AI_MAX_ATTEMPTS:2}
