spring:
  application:
    name: devpath-backend
  datasource:
    url: ${DEVPATH_DB_URL}
    username: ${DEVPATH_DB_USERNAME}
    password: ${DEVPATH_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
        provider:
          github:
            user-name-attribute: id
  session:
    store-type: jdbc
    timeout: ${DEVPATH_SESSION_IDLE_TIMEOUT:30m}
    jdbc:
      initialize-schema: never

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: ${DEVPATH_SESSION_COOKIE_NAME:DEVPATH_SESSION}
        http-only: true
        secure: ${DEVPATH_SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

devpath:
  runtime:
    worker-enabled: ${DEVPATH_WORKER_ENABLED:true}
  jobs:
    repository-sync:
      poll-interval: ${DEVPATH_REPOSITORY_SYNC_POLL_INTERVAL:1000}
      initial-delay: ${DEVPATH_REPOSITORY_SYNC_INITIAL_DELAY:1000}
    analysis:
      poll-interval: ${DEVPATH_ANALYSIS_POLL_INTERVAL:1000}
      initial-delay: ${DEVPATH_ANALYSIS_INITIAL_DELAY:1500}
  security:
    frontend-origin: ${DEVPATH_FRONTEND_ORIGIN}
    session-absolute-timeout: ${DEVPATH_SESSION_ABSOLUTE_TIMEOUT:12h}
    post-login-redirect: ${DEVPATH_POST_LOGIN_REDIRECT:/}
  scaffold:
    health-status: ok
  targets:
    version: v1
    careers: [backend, frontend, ai-engineer, devops, security, game, embedded, mobile, data-engineer]
    companies: [google, amazon, naver, kakao, toss, coupang]
  github:
    integration:
      client-id: ${GITHUB_INTEGRATION_CLIENT_ID:}
      client-secret: ${GITHUB_INTEGRATION_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_INTEGRATION_REDIRECT_URI:http://localhost:8080/api/v1/integrations/github/callback}
      credential-key: ${DEVPATH_PROVIDER_CREDENTIAL_KEY:}
      credential-key-version: ${DEVPATH_PROVIDER_CREDENTIAL_KEY_VERSION:local-v1}
