spring:
  application:
    name: devpath-backend
  datasource:
    url: ${DEVPATH_DB_URL}
    username: ${DEVPATH_DB_USERNAME}
    password: ${DEVPATH_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
        provider:
          github:
            user-name-attribute: id
  session:
    store-type: jdbc
    timeout: ${DEVPATH_SESSION_IDLE_TIMEOUT:30m}
    jdbc:
      initialize-schema: never

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: ${DEVPATH_SESSION_COOKIE_NAME:DEVPATH_SESSION}
        http-only: true
        secure: ${DEVPATH_SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

devpath:
  security:
    frontend-origin: ${DEVPATH_FRONTEND_ORIGIN}
    session-absolute-timeout: ${DEVPATH_SESSION_ABSOLUTE_TIMEOUT:12h}
    post-login-redirect: ${DEVPATH_POST_LOGIN_REDIRECT:/}
  scaffold:
    health-status: ok
