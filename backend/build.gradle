plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.devpath'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
    testImplementation 'org.testcontainers:postgresql:1.20.3'
}

tasks.named('test') {
    useJUnitPlatform()
    providers.environmentVariable('DOCKER_API_VERSION').orNull?.with { dockerApiVersion ->
        systemProperty 'api.version', dockerApiVersion
    }
}

tasks.named('bootRun') {
    doFirst {
        def envFile = project.file('.env')
        if (!envFile.isFile()) {
            logger.lifecycle('No backend/.env file found; using process environment variables only.')
            return
        }

        envFile.eachLine('UTF-8') { rawLine, lineNumber ->
            def line = rawLine.trim()
            if (line.isEmpty() || line.startsWith('#')) {
                return
            }
            if (line.startsWith('export ')) {
                line = line.substring('export '.length()).trim()
            }

            int separator = line.indexOf('=')
            if (separator <= 0) {
                throw new GradleException("Invalid backend/.env entry at line ${lineNumber}: expected KEY=VALUE")
            }

            def key = line.substring(0, separator).trim()
            if (!(key ==~ /[A-Za-z_][A-Za-z0-9_]*/)) {
                throw new GradleException("Invalid backend/.env key at line ${lineNumber}")
            }

            def value = line.substring(separator + 1).trim()
            if (value.length() >= 2) {
                char first = value.charAt(0)
                char last = value.charAt(value.length() - 1)
                if ((first == '"' && last == '"') || (first == '\'' && last == '\'')) {
                    value = value.substring(1, value.length() - 1)
                }
            }

            if (!System.getenv().containsKey(key)) {
                environment key, value
            }
        }

        logger.lifecycle('Loaded local environment variables from backend/.env; process environment variables take precedence.')
    }
}
